

services:
  postgres:
    image: postgres:16-alpine
    container_name: url_cutter_db
    environment:
      POSTGRES_DB: url_cutter_db
      POSTGRES_USER: tristan
      POSTGRES_PASSWORD: ${URL_CUTTER_DB_PASSWORD:-raypassword}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: url_cutter_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
