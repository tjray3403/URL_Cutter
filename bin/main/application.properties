spring.application.name=url_cutter

# Datasource Configuration
spring.datasource.url=${URL_CUTTER_DB_URL:jdbc:postgresql://localhost:5433/url_cutter_db}
spring.datasource.username=${URL_CUTTER_DB_USERNAME:tristan}
spring.datasource.password=${URL_CUTTER_DB_PASSWORD:raypassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

spring.config.import=optional:file:./.env[.properties]
